name: Deploy to Firebase Hosting and Rules on Push

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deploys Hosting automatically
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_VINYASANILAYA_WEBSITE }}'
          channelId: live
          projectId: vinyasanilaya-website

      # Authenticates for CLI tasks
      - name: Authenticate for Rules
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_VINYASANILAYA_WEBSITE }}'

      # Deploys Firestore Rules
      - name: Deploy Firestore Rules
        run: npx firebase-tools deploy --only firestore:rules --project vinyasanilaya-website

      - name: Build Summary
        run: |
          echo "### 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Main Website:** https://vinyasanilaya.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Guest Verification Portal:** https://vinyasanilaya.com/guestverification" >> $GITHUB_STEP_SUMMARY