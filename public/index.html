      display: flex;
      align-items: center;

      background-color: #25d366;
      color: white;

      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
    }
    .whatsapp-float:hover {
      transform: translateY(-5px);
      color: white;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
    }
